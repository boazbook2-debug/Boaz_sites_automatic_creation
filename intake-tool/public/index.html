<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Intake — דמו קמפיין</title>
<style>
  :root { --accent:#B08D57; --dark:#141414; --bg:#f5f5f4; --card:#fff; --border:#e2e2e0; --ready:#1e8e5a; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); margin:0; color: var(--dark); }
  header { position: sticky; top:0; background: var(--dark); color:#fff; padding: 12px 20px; z-index: 50; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size: 16px; margin:0; font-weight:600; }
  .stats { display:flex; gap:14px; font-size:13px; opacity:.9; }
  .bar-wrap { flex:1; min-width:160px; height:8px; background:#333; border-radius:4px; overflow:hidden; }
  .bar { height:100%; background: var(--accent); width:0%; transition: width .2s; }
  button { cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600; padding:10px 16px; }
  .btn-primary { background: var(--accent); color:#141414; }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-secondary { background:#2a2a2a; color:#fff; }
  .btn-secondary:hover { background:#3a3a3a; }
  main { max-width: 900px; margin: 20px auto; padding: 0 16px 80px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card.ready { border-color: var(--ready); box-shadow: 0 0 0 2px rgba(30,142,90,.15); }
  .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .card-head h2 { font-size: 16px; margin:0 0 2px; }
  .meta { font-size: 12px; color:#666; }
  .links { display:flex; gap:8px; margin-top:8px; }
  .links a { font-size:13px; padding:6px 10px; border-radius:6px; background:#eef0ee; color:#141414; text-decoration:none; }
  .links a.disabled { opacity:.4; pointer-events:none; }
  .links a.yad2-confirmed { background:#1e8e5a; color:#fff; }
  .links a.yad2-unconfirmed { opacity:.6; }
  .field-block { margin-top:14px; }
  .field-label { font-size:13px; font-weight:700; margin-bottom:4px; }
  .drop, .slot-drop { margin-top:2px; border:2px dashed #cfcfcc; border-radius:10px; padding:14px; text-align:center; font-size:13px; color:#777; cursor:pointer; transition: background .15s; }
  .drop.drag, .slot-drop.drag { background:#f0ece2; border-color: var(--accent); }
  .drop-add { padding:10px; font-size:12px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .thumb { position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border); cursor:grab; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .thumb .rm { position:absolute; top:1px; left:1px; background:rgba(0,0,0,.6); color:#fff; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:18px; text-align:center; cursor:pointer; }
  .slot-filled { display:flex; align-items:center; gap:8px; }
  .slot-filled img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .btn-tiny { font-size:11px; padding:5px 10px; border-radius:6px; background:#eef0ee; border:none; cursor:pointer; font-weight:600; }
  .btn-tiny:hover { background:#dfe3df; }
  .custom-list { margin-top:4px; }
  .custom-item { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .custom-thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--border); flex-shrink:0; }
  .custom-desc { flex:1; font-size:12px; padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-family:inherit; }
  .score-row { font-size:13px; font-weight:700; color:#8a6d1f; margin-top:2px; }
  .why { font-size:12px; color:#3a6b4f; background:#eef6f0; padding:6px 9px; border-radius:6px; margin-top:6px; display:block; line-height:1.5; }
  .prior-notes { font-size:11px; color:#999; margin-top:4px; }
  textarea { width:100%; margin-top:10px; min-height:70px; border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; font-family:inherit; resize:vertical; }
  .notes { width:100%; margin-top:6px; min-height:36px; border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:12px; font-family:inherit; }
  .ready-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .ready-row label { font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .ready-row input { width:20px; height:20px; }
  .result { margin-top:8px; font-size:13px; padding:8px; border-radius:8px; background:#f0f7f1; }
  .result.failed { background:#fdeeee; }
  .toolbar { display:flex; gap:10px; justify-content:center; margin: 16px 0; }
  .empty { text-align:center; color:#888; padding: 40px; }
  small.label { font-size:11px; color:#999; display:block; margin-top:8px; }
  .tier { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:5px; margin-inline-end:6px; vertical-align:2px; }
  .tier-A { background:#1e8e5a; color:#fff; }
  .tier-B { background:#c9922e; color:#fff; }
  .tier-C { background:#999; color:#fff; }
  .why { font-size:12px; color:#3a6b4f; background:#eef6f0; padding:4px 8px; border-radius:6px; margin-top:4px; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>Intake — נותרו לעיבוד</h1>
  <a href="/results.html" class="btn-secondary" style="text-decoration:none;display:inline-block">🏁 תוצאות (אתרים מוכנים)</a>
  <div class="stats">
    <span id="stat-total">0 סה"כ</span>
    <span id="stat-ready">0 מוכן</span>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <button class="btn-secondary" onclick="scrollNextIncomplete()">הבא שלא הושלם ⟵</button>
  <button class="btn-primary" onclick="generateAll()">GENERATE ALL READY DEMOS</button>
</header>
<main id="main"><div class="empty">טוען...</div></main>
<script src="app.js"></script>
</body>
</html>
